[workspace]
resolver = "3"
members = ["crates/term-core", "crates/term-view", "crates/colmena"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Joakoali/colmena"

[workspace.dependencies]
alacritty_terminal = "=0.26.0"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
term-core = { path = "crates/term-core" }
term-view = { path = "crates/term-view" }

[profile.release]
lto = "thin"
codegen-units = 1
